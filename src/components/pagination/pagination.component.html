<div class="d-flex justify-content-end">
    <div class="overflow-auto" style="max-width: 100%;">
        <ul class="pagination">
            <li class="page-item disabled"><span class="page-link">Resultados por página</span></li>
            <li class="page-item" [ngClass]="{'active': selectedNumber === 5}" (click)="setResultNumber(5)">
                <span class="page-link">5</span>
            </li>
            <li class="page-item" [ngClass]="{'active': selectedNumber === 10}" (click)="setResultNumber(10)">
                <span class="page-link">10</span>
            </li>
            <li class="page-item" [ngClass]="{'active': selectedNumber === 20}" (click)="setResultNumber(20)">
                <span class="page-link">20</span>
            </li>
        </ul>
    </div>
</div>

<div class="d-flex justify-content-end">
    <div class="overflow-auto" style="max-width: 100%;">
        <ul class="pagination">
            <li class="page-item" (click)="setPageNumber(selectedPageNumber - 1)">
                <span class="page-link">Anterior</span>
            </li>

            <div class="d-flex overflow-auto">
                @for (page of pagesNumber; track $index) {
                <li class="page-item" [ngClass]="{'active': selectedPageNumber === page}" (click)="setPageNumber(page)">
                    <span class="page-link">{{page}}</span>
                </li>
                }
            </div>

            <li class="page-item" (click)="setPageNumber(selectedPageNumber + 1)">
                <span class="page-link">Siguiente</span>
            </li>
        </ul>
    </div>
</div>
