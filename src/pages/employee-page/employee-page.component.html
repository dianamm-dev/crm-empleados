@if (loading)
{
<div class="d-flex justify-content-center align-items-center" style="height: 100vh;">
  <div class="spinner-border text-secondary" style="width: 5rem; height: 5rem;" role="status">
    <span class="visually-hidden">Cargando...</span>
  </div>
</div>
} @else if (error != '') {
<div class="alert alert-danger text-center mb-3" role="alert">{{error}}</div>
} @else {
<div class="container">
  <div class="row align-items-center">
    <div class="col-12 col-sm-11 col-lg-11">
      <app-filter [reset]="resetFiltersTrigger" (typeChanged)="typeChanged($event)"
        (valueChanged)="filterChanged($event)"></app-filter>
    </div>
    <div class="col-12 col-sm-1 col-lg-1 d-flex justify-content-center">
      <button class="btn btn-outline-danger" (click)="clearFilter()">
        <i class="bi bi-x-circle"></i>
      </button>
    </div>
  </div>

  @if (paginatedEmployees.length > 0) {
  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4 align-items-stretch">
    @for (e of paginatedEmployees; track $index) {
    <div class="col d-flex">
      <app-employee-card [employee]="e" class="mb-4 w-100 d-flex flex-column"></app-employee-card>
    </div>
    }
  </div>
  } @else {
  <div class="alert alert-warning" role="alert">
    <h4 class="alert-heading">No hay resultados</h4>
    <hr>
    <p class="mb-0">Prueba a modificar los filtros.</p>
  </div>
  }

  <app-pagination [reset]="resetFiltersTrigger" [resultsLength]="filteredEmployees.length"
    (pageNumberChanged)="pageNumberChanged($event)"
    (resultNumberChanged)="resultNumberChanged($event)"></app-pagination>
</div>
}
